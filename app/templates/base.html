<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Personal Finance Tracker{% endblock %}
    
    <!-- Premium Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..900&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    {% block extra_head %}{% endblock %}
</head>
<body class="app-shell">
    {% if current_user.is_authenticated %}
    <!-- Top Navigation Bar -->
    <nav class="topnav" role="navigation" aria-label="Main navigation">
        <div class="topnav-inner">
            <a href="{{ url_for('main.dashboard') }}" class="topnav-brand" aria-label="Finance Tracker Home">
                Ledger
            </a>
            
            <div class="topnav-links">
                <a href="{{ url_for('main.dashboard') }}" class="topnav-link {% if request.endpoint == 'main.dashboard' %}active{% endif %}">Dashboard</a>
                <a href="{{ url_for('transactions.index') }}" class="topnav-link {% if request.endpoint and request.endpoint.startswith('transactions') %}active{% endif %}">Transactions</a>
                <a href="{{ url_for('analytics.index') }}" class="topnav-link {% if request.endpoint and request.endpoint.startswith('analytics') %}active{% endif %}">Analytics</a>
                <a href="{{ url_for('goals.index') }}" class="topnav-link {% if request.endpoint and request.endpoint.startswith('goals') %}active{% endif %}">Goals</a>
                <a href="{{ url_for('categorization.index') }}" class="topnav-link {% if request.endpoint and request.endpoint.startswith('categorization') %}active{% endif %}">Categories</a>
            </div>
            
            <div class="topnav-actions">
                <a href="{{ url_for('transactions.add') }}" class="btn btn-primary">
                    <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                    <span class="desktop-only">Add Transaction</span>
                </a>
                
                <div class="user-menu-wrapper">
                    <button id="userMenuBtn" class="user-menu-btn" aria-expanded="false" aria-haspopup="true">
                        <span class="desktop-only">{{ current_user.email[:20] }}</span>
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="6 9 12 15 18 9"></polyline>
                        </svg>
                    </button>
                    <div id="userMenu" class="user-dropdown hidden" role="menu">
                        <a href="{{ url_for('auth.profile') }}" role="menuitem">Profile</a>
                        <form action="{{ url_for('auth.logout') }}" method="POST">
                            <button type="submit" role="menuitem">Log Out</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </nav>
    
    <!-- Application Body -->
    <div class="app-body">
        <!-- Integrated Sidebar Navigation -->
        <aside class="sidebar">
            <nav class="sidebar-nav" aria-label="Sidebar navigation">
                <a href="{{ url_for('main.dashboard') }}" class="sidebar-link {% if request.endpoint == 'main.dashboard' %}active{% endif %}" data-tooltip="Dashboard">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"></path></svg>
                    <span>Dashboard</span>
                </a>
                <a href="{{ url_for('transactions.index') }}" class="sidebar-link {% if request.endpoint and request.endpoint.startswith('transactions') %}active{% endif %}" data-tooltip="Transactions">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"></path></svg>
                    <span>Transactions</span>
                </a>
                <a href="{{ url_for('analytics.index') }}" class="sidebar-link {% if request.endpoint and request.endpoint.startswith('analytics') %}active{% endif %}" data-tooltip="Analytics">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path></svg>
                    <span>Analytics</span>
                </a>
                <a href="{{ url_for('goals.index') }}" class="sidebar-link {% if request.endpoint and request.endpoint.startswith('goals') %}active{% endif %}" data-tooltip="Goals">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"></path></svg>
                    <span>Goals</span>
                </a>
                <a href="{{ url_for('categorization.index') }}" class="sidebar-link {% if request.endpoint and request.endpoint.startswith('categorization') %}active{% endif %}" data-tooltip="Categories">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M7 7h.01M7 3h5c.512 0 1.024.195 1.414.586l7 7a2 2 0 010 2.828l-7 7a2 2 0 01-2.828 0l-7-7A1.994 1.994 0 013 12V7a4 4 0 014-4z"></path></svg>
                    <span>Categories</span>
                </a>
            </nav>
        </aside>
        
        <!-- Main Content Area -->
        <main class="main-content" id="main-content">
            <div class="content-container">
                {% with messages = get_flashed_messages(with_categories=true) %}
                    {% if messages %}
                        <div class="flex-col gap-2 mb-6">
                            {% for category, message in messages %}
                                <div class="alert alert-{% if category == 'error' %}danger{% elif category == 'success' %}success{% else %}info{% endif %}">
                                    <span>{{ message }}</span>
                                    <button type="button" onclick="this.parentElement.remove()" style="background: none; border: none; color: inherit; cursor: pointer; font-size: 18px; line-height: 1;">&times;</button>
                                </div>
                            {% endfor %}
                        </div>
                    {% endif %}
                {% endwith %}
                
                {% block content %}{% endblock %}
            </div>
        </main>
    </div>
    
    <!-- Mobile Bottom Navigation -->
    <nav class="mobile-bottom-nav" role="navigation" aria-label="Mobile navigation">
        <a href="{{ url_for('main.dashboard') }}" class="mobile-nav-item {% if request.endpoint == 'main.dashboard' %}active{% endif %}">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"></path></svg>
            <span>Dashboard</span>
        </a>
        <a href="{{ url_for('transactions.index') }}" class="mobile-nav-item {% if request.endpoint and request.endpoint.startswith('transactions') %}active{% endif %}">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"></path></svg>
            <span>Transactions</span>
        </a>
        <a href="{{ url_for('analytics.index') }}" class="mobile-nav-item {% if request.endpoint and request.endpoint.startswith('analytics') %}active{% endif %}">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path></svg>
            <span>Analytics</span>
        </a>
        <a href="{{ url_for('goals.index') }}" class="mobile-nav-item {% if request.endpoint and request.endpoint.startswith('goals') %}active{% endif %}">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"></path></svg>
            <span>Goals</span>
        </a>
        <a href="{{ url_for('categorization.index') }}" class="mobile-nav-item {% if request.endpoint and request.endpoint.startswith('categorization') %}active{% endif %}">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M7 7h.01M7 3h5c.512 0 1.024.195 1.414.586l7 7a2 2 0 010 2.828l-7 7a2 2 0 01-2.828 0l-7-7A1.994 1.994 0 013 12V7a4 4 0 014-4z"></path></svg>
            <span>Categories</span>
        </a>
    </nav>
    {% else %}
    <main class="main-content" style="padding-top: var(--space-8); margin-left: 0;">
        <div class="content-container">
            {% block unauthenticated_content %}{% endblock %}
        </div>
    </main>
    {% endif %}
    
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // User Menu Toggle
            const userMenuBtn = document.getElementById('userMenuBtn');
            const userMenu = document.getElementById('userMenu');
            
            if (userMenuBtn && userMenu) {
                userMenuBtn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    userMenu.classList.toggle('hidden');
                    this.setAttribute('aria-expanded', !userMenu.classList.contains('hidden'));
                });
                
                document.addEventListener('click', function(e) {
                    if (!userMenuBtn.contains(e.target) && !userMenu.contains(e.target)) {
                        userMenu.classList.add('hidden');
                        userMenuBtn.setAttribute('aria-expanded', 'false');
                    }
                });
            }
            
            {% block page_scripts %}{% endblock %}
        });
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
