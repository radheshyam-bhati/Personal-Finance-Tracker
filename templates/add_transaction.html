{% extends "base.html" %}

{% block title %}Add Transaction - Personal Finance Tracker{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto">
    <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-8">
        <h1 class="text-2xl font-bold text-gray-900 mb-6">Add Transaction</h1>
        
        <form method="POST" class="space-y-6">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Type</label>
                <div class="grid grid-cols-2 gap-3">
                    <label class="relative flex items-center justify-center p-4 border-2 rounded-lg cursor-pointer hover:bg-gray-50 {% if not request.form.type or request.form.type == 'income' %}border-primary-500 bg-primary-50{% else %}border-gray-200{% endif %}">
                        <input type="radio" name="type" value="income" class="sr-only" {% if not request.form.type or request.form.type == 'income' %}checked{% endif %}>
                        <div class="flex flex-col items-center">
                            <svg class="w-6 h-6 text-primary-600 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                            <span class="font-medium text-gray-900">Income</span>
                        </div>
                    </label>
                    <label class="relative flex items-center justify-center p-4 border-2 rounded-lg cursor-pointer hover:bg-gray-50 {% if request.form.type == 'expense' %}border-danger-500 bg-danger-50{% else %}border-gray-200{% endif %}">
                        <input type="radio" name="type" value="expense" class="sr-only" {% if request.form.type == 'expense' %}checked{% endif %}>
                        <div class="flex flex-col items-center">
                            <svg class="w-6 h-6 text-danger-600 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 9V7a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2m2 4h10a2 2 0 002-2v-6a2 2 0 00-2-2H9a2 2 0 00-2 2v6a2 2 0 002 2zm7-5a2 2 0 11-4 0 2 2 0 014 0z"></path></svg>
                            <span class="font-medium text-gray-900">Expense</span>
                        </div>
                    </label>
                </div>
            </div>

            <div>
                <label for="category" class="block text-sm font-medium text-gray-700 mb-2">Category</label>
                <select name="category" id="category" required class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-transparent">
                    <option value="">Select a category</option>
                    {% for cat in categories.income %}
                    <option value="{{ cat }}" data-type="income" {% if request.form.category == cat %}selected{% endif %}>{{ cat }}</option>
                    {% endfor %}
                    {% for cat in categories.expense %}
                    <option value="{{ cat }}" data-type="expense" {% if request.form.category == cat %}selected{% endif %}>{{ cat }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label for="amount" class="block text-sm font-medium text-gray-700 mb-2">Amount ($)</label>
                    <input type="number" name="amount" id="amount" step="0.01" min="0.01" required value="{{ request.form.amount or '' }}" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-transparent" placeholder="0.00">
                </div>
                <div>
                    <label for="date" class="block text-sm font-medium text-gray-700 mb-2">Date</label>
                    <input type="date" name="date" id="date" required value="{{ request.form.date or today }}" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-transparent">
                </div>
            </div>

            <div>
                <label for="description" class="block text-sm font-medium text-gray-700 mb-2">Description (optional)</label>
                <input type="text" name="description" id="description" value="{{ request.form.description or '' }}" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-transparent" placeholder="e.g., Grocery shopping, Salary deposit">
            </div>

            <div class="flex space-x-4 pt-4">
                <button type="submit" class="flex-1 bg-primary-600 text-white py-3 px-6 rounded-lg font-medium hover:bg-primary-700 transition-colors">Save Transaction</button>
                <a href="{{ url_for('index') }}" class="flex-1 bg-gray-100 text-gray-700 py-3 px-6 rounded-lg font-medium text-center hover:bg-gray-200 transition-colors">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
const categorySelect = document.getElementById('category');
const typeRadios = document.querySelectorAll('input[name="type"]');

function filterCategories() {
    const selectedType = document.querySelector('input[name="type"]:checked').value;
    Array.from(categorySelect.options).forEach(opt => {
        if (!opt.value) return;
        opt.style.display = opt.dataset.type === selectedType ? '' : 'none';
        if (opt.selected && opt.dataset.type !== selectedType) {
            categorySelect.value = '';
        }
    });
}

typeRadios.forEach(radio => radio.addEventListener('change', filterCategories));
filterCategories();
</script>
{% endblock %}
